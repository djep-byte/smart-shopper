<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Smart Shopper — Rute Belanja Optimal</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Smart Shopper</h1>
        <p>Pilih kategori produk, dapatkan rute belanja tercepat tanpa peta</p>
      </header>

      <main>
        <section class="selection">
          <h2>Pilih Kategori</h2>
          <div class="categories">
            {% for cat in categories %}
            <label class="checkbox-label">
              <input type="checkbox" value="{{ cat }}" />
              <span>{{ cat }}</span>
            </label>
            {% endfor %}
          </div>

          <div class="actions">
            <button id="compute-btn">Hitung Rute</button>
            <button id="reset-btn">Reset Pilihan</button>
          </div>
        </section>

        <section id="result">
          <h2>Rute Optimal</h2>
          <div class="summary">
            <p>
              <strong>Jarak total (estimasi):</strong>
              <span id="distance">0</span> meter
            </p>
          </div>
          <ol id="steps" class="steps-list"></ol>
        </section>
      </main>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
  </body>
</html>
